<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Pandas — DDD Vancouver pitch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F4EC; --card:#FFFFFF; --ink:#0E1B33; --navy:#0B1F3A; --emerald:#087A5D; --mint:#12B886;
  --coral:#C9301A; --gold:#F5B700; --slate:#4A5872; --line:#E3DDCF; --grey:#B4BCCB; --soft:#D8F3EA;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#121A26;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);overflow:hidden}
#fit{position:fixed;inset:0}
#stage{width:1920px;height:1080px;position:absolute;left:50%;top:50%;transform-origin:center center;background:var(--paper);overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.45)}
.slide{position:absolute;inset:0;padding:96px 112px 128px;display:flex;flex-direction:column;gap:26px;
  opacity:0;visibility:hidden;transform:translateX(70px) scale(.98);
  transition:opacity .40s ease,transform .55s cubic-bezier(.22,.9,.24,1),visibility 0s linear .55s}
.slide.prev{transform:translateX(-70px) scale(.98)}
.slide.on{opacity:1;visibility:visible;transform:none;transition:opacity .40s ease,transform .55s cubic-bezier(.22,.9,.24,1),visibility 0s}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.slide.on>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.slide.on>*:nth-child(1){animation-delay:.10s}.slide.on>*:nth-child(2){animation-delay:.16s}
.slide.on>*:nth-child(3){animation-delay:.22s}.slide.on>*:nth-child(4){animation-delay:.28s}
.slide.on>*:nth-child(5){animation-delay:.34s}.slide.on>*:nth-child(6){animation-delay:.40s}
.slide.on>*:nth-child(n+7){animation-delay:.46s}
.slide.on>svg,.slide.on>.foot,.slide.on>.nostagger{animation:none}
@keyframes twk{0%,100%{opacity:.22}50%{opacity:1}}
.tw{animation-name:twk;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.slide.dark{background:var(--navy);color:#fff}
.eyebrow{font-size:25px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--emerald)}
.dark .eyebrow{color:var(--mint)}
h1{font-size:98px;font-weight:800;line-height:1.05;letter-spacing:-1.5px}
h2{font-size:66px;font-weight:800;line-height:1.08;letter-spacing:-1px}
h3{font-size:34px;font-weight:800}
.sub{font-size:30px;color:var(--slate);font-weight:500}
.dark .sub{color:#A8C0DA}
.big{font-size:112px;font-weight:800;line-height:1;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:22px}
.col{display:flex;flex-direction:column;gap:14px}
.grow{flex:1}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:26px 30px;display:flex;flex-direction:column;gap:10px}
.pill{display:inline-flex;align-items:center;gap:10px;font-size:25px;font-weight:600;background:var(--card);
  border:1px solid var(--line);border-left:7px solid var(--slate);padding:12px 22px}
.pill.bad{background:#FDE4DE;border-color:#F3C8BE;border-left-color:var(--coral);color:var(--coral)}
.pill.good{background:var(--soft);border-color:#B7E4D4;border-left-color:var(--emerald);color:var(--emerald)}
.note{font-size:23px;color:var(--slate);line-height:1.35}
.foot{position:absolute;left:112px;right:112px;bottom:56px;display:flex;justify-content:space-between;font-size:21px;color:var(--slate)}
.dark .foot{color:#8FA8C4}
.hint{font-size:22px;font-weight:700;color:var(--emerald);display:flex;align-items:center;gap:9px}
.hint::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--emerald);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.5)}}
/* controls */
button{font:inherit;cursor:pointer}
.seg{display:inline-flex;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:5px;gap:4px}
.seg button{border:0;background:transparent;border-radius:999px;padding:11px 22px;font-size:24px;font-weight:700;color:var(--slate)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.sl{display:flex;flex-direction:column;gap:8px;min-width:330px}
.sl .top{display:flex;justify-content:space-between;font-size:24px;font-weight:700}
.sl output{font-variant-numeric:tabular-nums;color:var(--emerald)}
input[type=range]{width:100%;height:34px;background:transparent;-webkit-appearance:none;appearance:none}
input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:6px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;margin-top:-11px;border-radius:50%;background:var(--emerald);border:4px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25)}
input[type=range]::-moz-range-track{height:12px;border-radius:6px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--emerald);border:4px solid #fff}
.btn{border:2px solid var(--ink);background:var(--ink);color:#fff;border-radius:999px;padding:13px 26px;font-size:24px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink)}
/* bars */
.bars{display:flex;flex-direction:column;gap:13px}
.brow{display:flex;align-items:center;gap:16px;font-size:26px}
.brow .lab{width:430px;text-align:right;line-height:1.2;flex:none}
.brow .track{flex:1;height:42px;position:relative;background:#EDEAE1;border-radius:9px;overflow:hidden}
.brow .fill{position:absolute;top:0;bottom:0;background:var(--emerald);border-radius:9px;transition:left .45s cubic-bezier(.2,.8,.2,1),width .45s cubic-bezier(.2,.8,.2,1),background .25s}
.brow .fill.grey{background:var(--grey)} .brow .fill.bad{background:var(--coral)} .brow .fill.gold{background:var(--gold)}
.brow .val{width:170px;font-weight:800;font-variant-numeric:tabular-nums;flex:none}
.brow.hl .lab{font-weight:800}
.bars.tight{gap:14px}.tight .brow{font-size:22px}.tight .brow .lab{width:640px}.tight .brow .track{height:38px}.tight .brow .val{width:120px}
.cols{display:flex;align-items:flex-end;gap:8px;height:300px}
.colw{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:7px;flex:1;height:100%;cursor:default}
.colw .bar{width:100%;max-width:84px;background:var(--grey);border-radius:8px 8px 0 0;transition:height .5s cubic-bezier(.2,.8,.2,1),background .2s}
.colw.on .bar{background:var(--emerald)}
.colw .cx{font-size:22px;color:var(--slate)} .colw .cv{font-size:22px;font-weight:800;opacity:0;transition:opacity .15s}
.colw:hover .cv,.colw.on .cv{opacity:1}
.colw.click{cursor:pointer} .colw.click:hover .bar{filter:brightness(1.08)}
/* map */
.maprow{display:flex;gap:30px;align-items:flex-start}
#mapwrap{position:relative;width:930px;flex:none}
#mapsvg{width:930px;height:676px;display:block}
.hood{stroke:#FFFFFF;stroke-width:3;cursor:pointer;transition:fill .25s,opacity .2s}
.hood:hover{opacity:.82}
.hood.sel{stroke:var(--ink);stroke-width:6}
.dot{fill:var(--navy);opacity:.45;pointer-events:none}
.panel{flex:1;display:flex;flex-direction:column;gap:14px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:22px;color:var(--slate);align-items:center}
.legend i{width:24px;height:24px;border-radius:6px;display:inline-block;margin-right:7px;vertical-align:-4px}
.kv{display:flex;justify-content:space-between;font-size:24px;padding:5px 0;border-bottom:1px solid var(--line)}
.kv b{font-variant-numeric:tabular-nums}
#tip{position:fixed;z-index:50;background:var(--navy);color:#fff;border-radius:12px;padding:12px 15px;font-size:20px;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:330px}
#tip b{display:block;margin-bottom:5px;font-size:22px}
#tip .r{display:flex;justify-content:space-between;gap:20px;opacity:.9}
/* histogram */
#hist{width:100%;height:230px}
.hbar{fill:var(--emerald)} .hbar.out{fill:var(--grey)}
/* table */
table{width:100%;border-collapse:collapse;font-size:24px}
th{text-align:left;background:var(--emerald);color:#fff;padding:12px 14px;font-weight:700}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
ul{padding-left:26px;display:flex;flex-direction:column;gap:11px;font-size:26px;line-height:1.3}
/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;height:54px;display:flex;align-items:center;justify-content:center;gap:16px;background:rgba(10,16,26,.86);color:#fff;font-size:15px;z-index:40}
#nav button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:5px 12px;font-size:14px}
#dots{display:flex;gap:6px}
#dots span{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer}
#dots span.on{background:var(--mint);transform:scale(1.25)}
#dots span.bk{background:rgba(245,183,0,.35)} #dots span.bk.on{background:var(--gold)}
#sid{opacity:.7;font-variant-numeric:tabular-nums}
#clock{font-variant-numeric:tabular-nums;min-width:48px;text-align:center;padding:3px 9px;border-radius:6px;background:rgba(255,255,255,.12)}
#clock.warn{background:rgba(245,183,0,.9);color:#12262B;font-weight:700}
#clock.over{background:var(--coral);color:#fff;font-weight:700}
.vis{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="fit"><div id="stage"></div></div>

</div>

<script>
(function(){
'use strict';
const D = JSON.parse(document.getElementById('data').textContent);
const M = D.metrics, A = M.assumptions, PB = M.price_basis, S = M.seasonality, B = M.benchmarks, R = M.recommendation, V = M.validation, DEC = M.decisions, T = M.tested;
const HOODS = D.hoods, ANAME = ['condo','townhouse','house'];

const CORE = new Set(HOODS.map((h,i)=>h.core?i:-1).filter(i=>i>=0));
const NS='http://www.w3.org/2000/svg';
const sv=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const num=v=>Math.round(v).toLocaleString('en-CA');
const f$=v=>(v<0?'−':'')+'$'+num(Math.abs(v));
const fK=v=>(v<0?'−':'')+'$'+num(Math.abs(v)/1000)+'K';

      TAXED=PMODE['Nightly all year, with Empty Homes Tax and Speculation Tax'], HYB=PMODE['Hybrid (recommended)'];

/* ---------- tiny DOM helper ---------- */
function h(tag,opt,kids){
  const e=document.createElement(tag); opt=opt||{};
  if(typeof opt==='string') opt={cls:opt};
  if(opt.cls)e.className=opt.cls;
  if(opt.text!=null)e.textContent=opt.text;
  if(opt.html!=null)e.innerHTML=opt.html;
  if(opt.style)e.setAttribute('style',opt.style);
  for(const k in opt.attr||{})e.setAttribute(k,opt.attr[k]);
  if(opt.on)for(const k in opt.on)e.addEventListener(k,opt.on[k]);
  (kids||opt.kids||[]).forEach(c=>c&&e.appendChild(c));
  return e;
}
const tip=document.getElementById('tip');
function showTip(x,y,title,rows){
  tip.replaceChildren();
  if(title)tip.appendChild(h('b',{text:title}));
  (rows||[]).forEach(r=>tip.appendChild(h('div','r',[h('span',{text:r[0]}),h('span',{text:r[1]})])));
  tip.hidden=false;
  const w=tip.offsetWidth,ht=tip.offsetHeight;
  tip.style.left=Math.max(8,Math.min(innerWidth-w-8,x+16))+'px';
  tip.style.top=Math.max(8,(y+ht+24>innerHeight)?y-ht-14:y+18)+'px';
}
function bindTip(node,fn){
  node.addEventListener('pointermove',e=>{const t=fn();if(t)showTip(e.clientX,e.clientY,t[0],t[1]);});
  node.addEventListener('pointerleave',()=>{tip.hidden=true;});
}

function fromHTML(str){const d=document.createElement('div');d.innerHTML=str.trim();return d.firstElementChild;}

        const lit=(i*7+r*3+c)%3===0, dur=(2.6+((i+r*2+c)%7)*0.55).toFixed(2), del=(((i*5+r*3+c*2)%13)*0.42).toFixed(2);

const ICON={

function icon(name,color,size){
  return fromHTML('<svg viewBox="0 0 48 48" width="'+(size||48)+'" height="'+(size||48)+'" aria-hidden="true" fill="none" stroke="'+color+'" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"><path d="'+ICON[name]+'"/></svg>');

function animView(svg,to,ms,done){
  const from=(svg.getAttribute('viewBox')||'').split(/\s+/).map(Number);
  if(from.length!==4){svg.setAttribute('viewBox',to.join(' '));if(done)done();return;}
  const t0=performance.now();
  (function step(t){
    const p=Math.min(1,(t-t0)/(ms||850)), e=p<0.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
    svg.setAttribute('viewBox',from.map((f,i)=>(f+(to[i]-f)*e).toFixed(2)).join(' '));
    if(p<1)requestAnimationFrame(step); else if(done)done();
  })(performance.now());
}
function boxOf(node,pad,aspect){
  const b=node.getBBox();
  let x=b.x-pad, y=b.y-pad, w=b.width+pad*2, hgt=b.height+pad*2;
  if(w/hgt<aspect){const nw=hgt*aspect;x-=(nw-w)/2;w=nw;} else {const nh=w/aspect;y-=(nh-hgt)/2;hgt=nh;}
  return [x,y,w,hgt];
}

/* ---------- shared widgets ---------- */
function barList(box,rows){
  box.replaceChildren();
  const vals=rows.map(r=>r.v).filter(isFinite);
  const max=Math.max(0,...vals), min=Math.min(0,...vals), span=(max-min)||1, z=(0-min)/span*100;
  rows.forEach(r=>{
    const fill=h('span','fill'+(r.cls?' '+r.cls:''));
    const w=Math.abs(r.v)/span*100;
    fill.style.width=w+'%'; fill.style.left=(r.v<0?z-w:z)+'%';
    const row=h('div','brow'+(r.hl?' hl':''),[h('span',{cls:'lab',text:r.label}),h('span','track',[fill]),h('span',{cls:'val',text:r.text})]);
    if(r.tip)bindTip(row,()=>r.tip);
    box.appendChild(row);
  });

}
function seg(options,value,onChange){
  const box=h('div','seg');
  options.forEach(o=>{
    const b=h('button',{text:o.label,attr:{type:'button','aria-pressed':String(o.value===value)}});
    b.addEventListener('click',()=>{[...box.children].forEach(c=>c.setAttribute('aria-pressed',String(c===b)));onChange(o.value);});
    box.appendChild(b);

function slider(label,min,max,step,value,fmt,onInput){
  const out=h('output',{text:fmt(value)});
  const inp=h('input',{attr:{type:'range',min:min,max:max,step:step,value:value,'aria-label':label}});
  inp.addEventListener('input',()=>{out.textContent=fmt(+inp.value);onInput(+inp.value);});
  return h('label','sl',[h('span','top',[h('span',{text:label}),out]),inp]);
}
function kv(k,v,strong){return h('div','kv',[h('span',{text:k}),h('b',{text:v,style:strong?'color:var(--emerald)':''})]);}
function counter(node,to,fmt,ms){
  const t0=performance.now(), from=0;
  function step(t){const p=Math.min(1,(t-t0)/(ms||900)), e=1-Math.pow(1-p,3);
    node.textContent=fmt(from+(to-from)*e); if(p<1)requestAnimationFrame(step);}
  requestAnimationFrame(step);
}

/* ===================== 7. calendars (click the months) ===================== */
slide({id:'calendar',build(s){
  const rows=pool({asset:0,beds:1,hoods:CORE});
  const chosen=new Set(S.peak_months);
  const cols=h('div',{cls:'cols',style:'height:300px;max-width:1020px'});
  const out=h('p',{cls:'big',style:'font-size:92px;color:var(--emerald)'});
  const warn=h('p',{cls:'note',style:'font-size:25px;min-height:64px'});
  const bars=h('div','bars');
  function seasonNOI(){
    let share=0; chosen.forEach(m=>{share+=S.month_share[String(m)];});
    const midMonths=12-chosen.size, uplift=S.peak_adr_uplift;
    let noi=0,cost=0;
    rows.forEach(r=>{
      const e=econ(r,BASE);
      const n=e.nights*share, guest=e.adr*uplift*n, pay=guest*(1-BASE.airbnbFee);
      const mg=pay*BASE.mgmtFee, cs=pay*A.supplies_pct+n/A.stay_nights*e.clean;
      const rent=e.lb===1?BASE.midRent:BASE.midRent*A.mid_rent['2']/A.mid_rent['1'];
      const mid=rent*midMonths*BASE.midOcc, mfee=mid*A.mid_mgmt, turn=A.mid_turnovers*A.mid_turn_cost;
      const misses=midMonths*30.44*BASE.midOcc<A.tenancy_days_required;
      noi+=pay-mg-cs+mid-mfee-turn-e.fixed-(misses?e.vt:0);
      cost+=e.allin;
    });
    const per=noi/rows.length;
    return {total:per*R.units,share:share,midMonths:midMonths,misses:midMonths*30.44*BASE.midOcc<A.tenancy_days_required};
  }
  function refresh(){
    const r=seasonNOI();
    out.textContent=fK(r.total);
    out.style.color=r.misses?'var(--coral)':'var(--emerald)';
    warn.textContent=r.misses
      ? 'Only '+r.midMonths+' months of long stays. That is under the six-month rule, so the empty-home taxes hit.'
      : r.midMonths+' months of long stays clears the six-month rule. These months hold '+fP(r.share,0)+' of the year\u2019s bookings.';
    barList(bars,[
      {label:'By the night, all year',v:NIGHT.noi_p50,text:fK(NIGHT.noi_p50),cls:'grey'},
      {label:'By the night, once the taxes hit',v:TAXED.noi_p50,text:fK(TAXED.noi_p50),cls:'bad'},
      {label:'A normal year-long lease',v:LEASEM.noi_p50,text:fK(LEASEM.noi_p50),cls:'grey'},
      {label:'The months you picked',v:r.total,text:fK(r.total),cls:r.misses?'bad':'',hl:true}
    ]);
    [...cols.children].forEach((w,i)=>w.classList.toggle('on',chosen.has(i+1)));
  }
  MONTHS.forEach((mn,i)=>{
    const m=i+1, bar=h('div','bar');
    bar.style.height=(S.month_share[String(m)]*100*6.3)+'%';
    const w=h('div','colw click',[h('span',{cls:'cv',text:fP(S.month_share[String(m)],0)}),bar,h('span',{cls:'cx',text:mn})]);
    w.addEventListener('click',()=>{chosen.has(m)?chosen.delete(m):chosen.add(m);refresh();});
    bindTip(w,()=>[mn,[['Share of the year’s bookings',fP(S.month_share[String(m)],1)],['Rented by the night',chosen.has(m)?'yes':'no']]]);
    cols.appendChild(w);
  });
  s.append(h('p',{cls:'eyebrow',text:'How to run it · click the months'}),
    h('h2',{text:'Rent by the night all year and the tax bill eats it.'}),
    h('div',{cls:'row',style:'gap:46px;align-items:flex-start'},[
      h('div',{cls:'col grow'},[h('p',{cls:'sub',style:'font-size:25px',text:'When people actually book. Green months we rent by the night.'}),cols,bars]),
      h('div',{cls:'card',style:'width:520px;flex:none'},[h('p',{cls:'note',style:'font-size:25px',text:'Rent left over in 2027, all '+R.units+' homes (straight-line estimate)'}),out,warn])
    ]));
  refresh();
}});

slide({id:'econ',backup:true,build(s){

    const o=describe(simulate(rows,P,'hybrid',{seed:(Math.random()*1e9)|0,nsim:500,budget:M.budget,erosion:0,tax:false}));
    svg.replaceChildren();
    const vals=o.noi, lo=Math.min(...vals), hi=Math.max(...vals), bins=26, c=new Array(bins).fill(0);
    vals.forEach(v=>{c[Math.min(bins-1,Math.floor((v-lo)/((hi-lo)||1)*bins))]++;});
    const mx=Math.max(...c);
    c.forEach((n,i)=>{const hgt=n/mx*195, x=i*(600/bins);
      sv('rect',{x:x+1.5,y:200-hgt,width:600/bins-3,height:hgt,class:'hbar'+((lo+(i+0.5)*(hi-lo)/bins)<o.p10?' out':''),rx:3},svg);});
    sv('line',{x1:(o.p50-lo)/((hi-lo)||1)*600,x2:(o.p50-lo)/((hi-lo)||1)*600,y1:0,y2:206,stroke:'#0E1B33','stroke-width':3},svg);
    histNote.textContent='500 simulated years with these settings: expected '+fK(o.p50)+', 1 in 10 below '+fK(o.p10)+', 1 in 10 above '+fK(o.p90)+'. Chance of under 1% yield: '+fP(o.below,0)+'.';
  }

    ['8. Gastown/Chinatown at the west-side price','Filed under Downtown Eastside; they trade like downtown','Yield '+fP(DEC.dtes_west_price.nightly_yield)+', not '+fP(DEC.dtes_east_price.nightly_yield)]];
  s.append(h('p',{cls:'eyebrow',text:'Backup'}),h('h2',{text:'Decision log.'}),
    h('table',{style:'font-size:21px'},[h('thead',{},[h('tr',{},['Decision','Why (evidence or alternatives)','What changed'].map(x=>h('th',{text:x})))]),
      h('tbody',{},L.map(r=>h('tr',{},r.map(c=>h('td',{text:c})))))]));
}});
slide({id:'validation',backup:true,build(s){
  const rt=Object.fromEntries(M.snapshot_retest.map(r=>[r.segment,r])), c1=rt['Core one-bedroom apartments'];
  const RW=[['Our revenue arithmetic vs Inside Airbnb’s estimate','Correlation '+V.v1_revenue_corr.toFixed(2)],
    ['Inside Airbnb’s occupancy field','Reproduced for '+fP(V.v2_occupancy_formula_match,1)+' of listings'],
    ['Same pipeline on the September snapshot','Core one-bedroom yield '+fP(c1.sept_yield)+' vs '+fP(c1.june_yield)+'; segment ranking correlation '+V.v5_rank_correlation_june_vs_sept.toFixed(2)+' across '+V.v5_segments_compared+' segments'],
    ['Split sample, 300 random halves','Top three segments beat the average on the other half '+fP(V.v4_top3_beat_average_share,0)+' of the time'],
    ['Forward calendar, 15 June to 31 August','Estimate implies '+fP(V.v3_median_estimated_summer_occupancy,0)+' of nights; '+fP(V.v3_median_summer_unavailable,0)+' already booked or blocked. Plausibility only'],
    ['First-year listings','Median '+num(V.v6_nights_9_12_months)+' nights at 9–12 months vs '+num(V.v6_nights_12_plus_months)+' for established ones']];
  s.append(h('p',{cls:'eyebrow',text:'Backup'}),h('h2',{text:'How we checked the result.'}),
    h('table',{},[h('thead',{},[h('tr',{},['Check','Result'].map(x=>h('th',{text:x})))]),h('tbody',{},RW.map(r=>h('tr',{},r.map(c=>h('td',{text:c})))))]));
}});
slide({id:'limits',backup:true,build(s){
  s.append(h('p',{cls:'eyebrow',text:'Backup'}),h('h2',{text:'Limits, sources and use of AI.'}),
    h('div',{cls:'row',style:'gap:46px'},[
      h('div',{cls:'col grow'},[h('h3',{text:'Limits'}),h('ul',{style:'font-size:24px'},[
        'One day’s scrape: quotes, listings and licences as of 15 June 2026',
        'Licence status comes from free text: an estimate, not a compliance finding',
        'Occupancy and revenue are Inside Airbnb estimates from review counts',
        'Purchase prices are area benchmarks, not building prices',
        'Furnished rent and off-season occupancy are our assumptions',
        'The tax and tenancy reading is ours and needs counsel'].map(t=>h('li',{text:t})))]),
      h('div',{cls:'col grow'},[h('h3',{text:'Sources'}),h('ul',{style:'font-size:24px'},[
        'Inside Airbnb, Get the Data (Vancouver), 15 June 2026, CC BY 4.0',
        M.benchmark_source,
        'City of Vancouver: Empty Homes Tax; short-term rental licence',
        'Province of BC: Speculation and Vacancy Tax rates',
        'CMHC Rental Market Report; liv.rent asking rents',
        'Airbnb: service fee change'].map(t=>h('li',{text:t})))])
    ]),
    h('p',{cls:'note',style:'font-size:25px',text:'Use of AI: Claude (Anthropic) wrote the pipeline, this page and the slide text under the team’s direction. We checked it by reproducing Inside Airbnb’s formulas, re-running on the September snapshot, and a test that compares every published number with the script output. Every member of the team can defend each decision in the log.'}));
}});

/* ---------- build + navigate ---------- */
const nMain=SLIDES.filter(s=>!s.backup).length;
SLIDES.forEach((def,i)=>{
  const s=document.createElement('section');
  s.className='slide'+(def.dark?' dark':'');
  s.id='s-'+def.id;
  def.build(s);
  if(s.enter)def.enter=s.enter; if(s.leave)def.leave=s.leave;
  if(def.id!=='cover'){
    s.appendChild(foot(i,nMain));
    const m=h('div',{style:'position:absolute;right:112px;top:84px;opacity:'+(def.dark?'0.9':'0.75')});
    m.appendChild(mark(52,def.dark)); s.appendChild(m);
  }
  def.node=s; stage.appendChild(s);
});
let cur=0;
const dots=document.getElementById('dots'), sid=document.getElementById('sid');
SLIDES.forEach((def,i)=>{
  const d=h('span',{cls:def.backup?'bk':'',attr:{title:def.id}});
  d.addEventListener('click',()=>go(i)); dots.appendChild(d);
});
function go(i){
  i=Math.max(0,Math.min(SLIDES.length-1,i));
  if(i===cur&&SLIDES[cur].node.classList.contains('on'))return;
  const back=i<cur, old=SLIDES[cur].node, nw=SLIDES[i].node;
  if(SLIDES[cur].leave)SLIDES[cur].leave();
  old.classList.remove('on'); old.classList.toggle('prev',!back);
  nw.classList.toggle('prev',back);
  void nw.offsetWidth;
  cur=i;
  nw.classList.add('on');
  if(SLIDES[cur].enter)SLIDES[cur].enter();
  if(t0===null&&cur>0)t0=Date.now();
  [...dots.children].forEach((d,j)=>d.classList.toggle('on',j===cur));
  sid.textContent=(cur<nMain?(cur+1)+' / '+nMain:'backup');
  tip.hidden=true;
  location.hash=SLIDES[cur].id;
}
const clock=document.getElementById('clock');
let t0=null;
setInterval(()=>{
  if(t0===null)return;
  const sec=Math.floor((Date.now()-t0)/1000);
  clock.textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
  clock.classList.toggle('warn',sec>=570&&sec<600);
  clock.classList.toggle('over',sec>=600);
},500);
clock.addEventListener('click',()=>{t0=null;clock.textContent='0:00';clock.className='';});

document.getElementById('prev').addEventListener('click',()=>go(cur-1));
document.getElementById('next').addEventListener('click',()=>go(cur+1));
document.getElementById('full').addEventListener('click',()=>{
  if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
});
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(cur+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1);}
  else if(e.key==='Home')go(0);
  else if(e.key==='End')go(nMain-1);
  else if(e.key==='b'||e.key==='B')go(nMain);
  else if(e.key==='f'||e.key==='F')document.getElementById('full').click();
});
function fit(){
  const k=Math.min(innerWidth/1920,(innerHeight-54)/1080);
  stage.style.transform='translate(-50%,-50%) scale('+k+')';
  stage.style.top='calc(50% - 27px)';
}
addEventListener('resize',fit); fit();
const start=SLIDES.findIndex(s=>s.id===location.hash.slice(1));
go(start>=0?start:0);
})();
</script>
