<script type="module">
import * as THREE from 'three';

/* ---------- the view through the windows: a painted Vancouver ---------- */
function viewTexture(){
  const cv=document.createElement('canvas'); cv.width=1400; cv.height=640; const g=cv.getContext('2d');
  const sky=g.createLinearGradient(0,0,0,640); sky.addColorStop(0,'#9CC3E2'); sky.addColorStop(0.62,'#F4DFC4'); sky.addColorStop(1,'#F6E7D2');
  g.fillStyle=sky; g.fillRect(0,0,1400,640);

  mtn([[0,330],[140,230],[260,300],[420,150],[560,280],[700,200],[860,300],[1000,170],[1160,290],[1300,220],[1400,260]],'#8FA6BB');
  g.fillStyle='#FFFFFF'; [[420,150],[1000,170],[140,230]].forEach(([x,y])=>{g.beginPath();g.moveTo(x,y);g.lineTo(x-34,y+30);g.lineTo(x+34,y+30);g.closePath();g.fill();});
  mtn([[0,380],[200,320],[380,370],[560,310],[760,380],[980,320],[1200,370],[1400,330]],'#6F8BA5');
  g.fillStyle='#5E86A6'; g.fillRect(0,430,1400,60);
  let x=0, s=7; const rnd=()=>{s=(s*9301+49297)%233280;return s/233280;};
  while(x<1400){ const w=40+rnd()*70, h=90+rnd()*230, top=500-h;
    g.fillStyle=rnd()>0.5?'#2C4C6E':'#1B2D45'; g.fillRect(x,top,w,640-top);
    for(let yy=top+12;yy<620;yy+=22) for(let xx=x+8;xx<x+w-10;xx+=16) if(rnd()>0.55){g.fillStyle=rnd()>0.7?'#F5B700':'#FBEBC4';g.fillRect(xx,yy,7,10);}
    x+=w+4; }
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; return t;
}
const VIEW = viewTexture();
function pane(x1,x2,y0,y1,u0,u1){

  m.position.set((x1+x2)/2,(y0+y1)/2,ZN); scene.add(m); return m;
}

box(0.6,0.012,0.5,'#15181C',0.4,0.91,2.95); box(0.6,0.012,0.42,'#AEB6BF',1.9,0.91,2.95);

/* ---------- labels ---------- */
const svgNS='http://www.w3.org/2000/svg', lines=document.getElementById('lines'), labelsDiv=document.getElementById('labels');
lines.setAttribute('viewBox','0 0 '+W+' '+H);
const wp = (obj,dx=0,dy=0,dz=0)=>()=>{ const v=new THREE.Vector3(dx,dy,dz); obj.localToWorld(v); return v; };
const fixed = (x,y,z)=>()=>new THREE.Vector3(x,y,z);
const LABELS = [
  {t:'Queen bed',           a:fixed(-3.3,0.62,-1.95), off:[-330,-20], t0:2.4, t1:9.4},
  {t:'City-view window',    a:fixed(1.7,2.0,-3.25),   off:[250,40],   t0:3.1, t1:9.4},
  {t:'Full kitchen',        a:fixed(1.0,0.95,1.75),   off:[-260,120],  t0:3.8, t1:9.4},
  {t:'Self check-in lock',  a:wp(lock),               off:[70,-120],   t0:4.5, t1:9.4},
  {t:'Ensuite bathroom',    a:fixed(-2.6,0.9,2.6),    off:[-280,90],   t0:5.2, t1:9.4},
  {t:'Fresh linens for every guest', a:wp(towels,0,0.14,0), off:[-330,30], t0:10.0, t1:14.6, k:'s'},
  {t:'A welcome kit at each stay',   a:wp(basket,0,0.2,0),  off:[-300,130],    t0:10.7, t1:14.6, k:'s'},
  {t:'Guests arrive with suitcases', a:wp(suitcases,0,0.66,0), off:[520,-10], t0:11.4, t1:14.6, k:'s'},
  {t:'A real desk for a month-long stay', a:wp(desk,-0.3,0.4,0), off:[260,-20], t0:18.0, t1:24.6, k:'w'},
  {t:'Room for a whole wardrobe',         a:wp(wardrobe,0.3,1.4,0), off:[-300,60], t0:18.7, t1:24.6, k:'w'},
  {t:'Coats and boots for the winter',    a:wp(coats,0,1.3,0), off:[300,40], t0:19.4, t1:24.6, k:'w'},
];
LABELS.forEach(L=>{
  L.el=document.createElement('div'); L.el.className='lbl'+(L.k?' '+L.k:''); L.el.textContent=L.t; labelsDiv.appendChild(L.el);
  L.line=document.createElementNS(svgNS,'line'); L.line.setAttribute('stroke','#0E1B33'); L.line.setAttribute('stroke-width','3'); lines.appendChild(L.line);
  L.dot=document.createElementNS(svgNS,'circle'); L.dot.setAttribute('r','8'); L.dot.setAttribute('fill', L.k==='s'?'#F5B700':L.k==='w'?'#5EE0B5':'#12B886');
  L.dot.setAttribute('stroke','#0E1B33'); L.dot.setAttribute('stroke-width','3'); lines.appendChild(L.dot);
});

/* ---------- timeline ---------- */
const DUR = 30;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const sm=x=>{x=clamp(x);return x*x*(3-2*x);};
const seg=(t,a,b)=>sm((t-a)/(b-a));
const backOut=x=>{x=clamp(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const pop=(t,a,d=0.55)=>backOut((t-a)/d);
const lerp=(a,b,x)=>a+(b-a)*x;
const SWITCH=15.0;
const summer=[[towels,0],[basket,1],[suitcases,2]];
const winter=[[clothes,0],[desk,1],[officeChair,1],[coats,2],[plant2,3],[books,3],[groceries,4]];
const cSum=new THREE.Color('#FFF1D6'), cWin=new THREE.Color('#D6E2F3');

window.renderAt = function(t){
  // camera: one slow orbit with a gentle push in and out
  const p = sm(t/DUR);
  const az = THREE.MathUtils.degToRad(lerp(18, 62, p));
  const el = THREE.MathUtils.degToRad(lerp(44, 36, p));
  const r  = 24.5 - 2.0*Math.sin(Math.PI*t/DUR);
  const tgt = new THREE.Vector3(0.2, 1.15, 0.2);
  camera.position.set(tgt.x + r*Math.cos(el)*Math.sin(az), tgt.y + r*Math.sin(el), tgt.z + r*Math.cos(el)*Math.cos(az));
  camera.lookAt(tgt); camera.updateMatrixWorld();

  // summer -> winter switch
  const w = seg(t, SWITCH, SWITCH+2.2);
  summer.forEach(([g,i])=>{ const s=1-seg(t,SWITCH+i*0.25,SWITCH+0.5+i*0.25); g.scale.setScalar(Math.max(0.0001,s)); g.visible=s>0.001; });
  winter.forEach(([g,i])=>{ const s=pop(t,SWITCH+0.6+i*0.3); g.scale.setScalar(Math.max(0.0001,s)); g.visible=s>0.001; });
  diningChair.scale.setScalar(Math.max(0.0001,1-seg(t,SWITCH+0.5,SWITCH+0.95))); diningChair.visible=t<SWITCH+0.95;
  const open = seg(t,SWITCH+0.5,SWITCH+1.6);
  doors.forEach(({piv,sign})=>{ piv.rotation.y = sign*-1.75*open; });
  doorPiv.rotation.y = lerp(-1.15,-0.05,seg(t,SWITCH,SWITCH+1.2));

  // light: warm summer sun, cooler winter with lamps on
  sun.color.copy(cSum).lerp(cWin,w); sun.intensity = lerp(2.6,1.95,w);
  hemi.intensity = lerp(1.35,1.15,w);
  pl1.intensity = 1.8*w; pl2.intensity = 1.2*w;
  floorShade.material.emissiveIntensity = lerp(0.15,1.2,w);
  bedLamps.forEach(m=>m.material.emissiveIntensity=lerp(0.15,1.0,w));
  lockLed.material.emissiveIntensity = 1.0+0.8*Math.sin(t*4);

  renderer.render(scene, camera);

  // overlays
  const fade = t<0.8 ? 1-sm(t/0.8) : t>DUR-0.7 ? sm((t-(DUR-0.7))/0.7) : 0;
  document.getElementById('fade').style.opacity = fade;
  document.getElementById('title').style.opacity = 1-seg(t,24.6,25.2);
  const m1=document.getElementById('m1'), m2=document.getElementById('m2');
  const a1 = seg(t,0.9,1.6)*(1-seg(t,SWITCH-0.2,SWITCH+0.3)), a2 = seg(t,SWITCH+0.2,SWITCH+0.8)*(1-seg(t,24.6,25.2));
  m1.style.opacity=a1; m1.style.transform='translateY('+(1-seg(t,0.9,1.6))*-16+'px)';
  m2.style.opacity=a2; m2.style.transform='translateY('+(1-seg(t,SWITCH+0.2,SWITCH+0.8))*-16+'px)';
  calCells.forEach((c,i)=>{ const isS=i>=4&&i<=7; const on = isS ? 1-w : w;
    c.style.opacity = 0.25+0.75*on; c.style.transform='scale('+(0.9+0.12*on)+')'; });
  document.getElementById('cal').style.opacity = seg(t,1.2,1.9)*(1-seg(t,24.6,25.2));
  const e=document.getElementById('end'), ea=seg(t,25.0,25.7);
  e.style.opacity=ea; e.style.transform='translateX(-50%) translateY('+(1-ea)*24+'px)';

  const v=new THREE.Vector3();
  LABELS.forEach(L=>{
    const a = seg(t,L.t0,L.t0+0.45)*(1-seg(t,L.t1-0.35,L.t1));
    v.copy(L.a()).project(camera);
    const x=(v.x+1)/2*W, y=(1-v.y)/2*H, lx=x+L.off[0], ly=y+L.off[1];
    L.el.style.opacity=a; L.dot.setAttribute('opacity',a); L.line.setAttribute('opacity',a);
    const bw=L.el.offsetWidth, bh=L.el.offsetHeight;
    let left = L.off[0]>=0 ? lx : lx-bw; left=Math.max(24,Math.min(W-bw-24,left));
    let top=Math.max(250,Math.min(720,ly-bh/2));
    L.el.style.left=left+'px'; L.el.style.top=top+'px';
    L.el.style.transform='translateY('+((1-seg(t,L.t0,L.t0+0.45))*10)+'px)';
    L.dot.setAttribute('cx',x); L.dot.setAttribute('cy',y);
    L.line.setAttribute('x1',x); L.line.setAttribute('y1',y); L.line.setAttribute('x2', L.off[0]>=0?left:left+bw); L.line.setAttribute('y2',top+bh/2);
  });
};
window.DUR = DUR;
await document.fonts.ready;
window.renderAt(new URLSearchParams(location.search).has('t') ? +new URLSearchParams(location.search).get('t') : 6);
window.ready = true;
</script>
